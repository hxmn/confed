name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs that need more say so.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keeps runner disks and CI caches manageable; backtraces still resolve.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUSTFLAGS: -D warnings
  # Every cargo command below runs with --locked: CI builds what Cargo.lock
  # says, and fails rather than quietly resolving something newer.

jobs:
  check:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo doc --locked --workspace --no-deps
      # The fuzz targets run on nightly, weekly; this keeps them building.
      # Their crate keeps no Cargo.lock (cargo-fuzz's layout), so no --locked.
      - run: cargo check --manifest-path crates/confed-converter/fuzz/Cargo.toml

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because slug and path handling differ there:
        # case-insensitive filesystems, path length limits, reserved names.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --workspace

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --workspace --all-targets

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # audit-check reports through a check run, which the default read-only
    # token may not create.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: licenses, advisories, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
