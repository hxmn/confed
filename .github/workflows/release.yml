name: Release

on:
  push:
    tags: ["v*"]
  # Build the binaries, and run the checks a release waits for, without
  # releasing or publishing anything: to try this workflow before a tag.
  workflow_dispatch:

jobs:
  # What CI checks, again for the tagged commit itself: nothing irrevocable
  # happens unless it passes.
  verify:
    name: tests and package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace
      - run: cargo publish --locked --workspace --dry-run

  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for Linux and Windows: SQLite is bundled C, and a
          # cross build there would need a C toolchain for the target. On
          # macOS, Apple's clang builds for both architectures from one
          # runner, and Intel runners are being retired, so x86_64 is built
          # on Apple silicon.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release -p confed --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="confed-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/confed.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/confed" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  github-release:
    name: GitHub release
    needs: [verify, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $version" >&2; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*

  publish:
    name: publish to crates.io
    # Off until crates.io trusted publishing is configured for all eight crates
    # (it can only be set up once a crate exists, so the first release is
    # published by hand). Turn on with the repository variable
    # PUBLISH_CRATES=true — see "Releasing" in AGENTS.md.
    # Irrevocable, so last: only once the tagged commit passed its checks, every
    # binary built, and the GitHub release exists.
    needs: [verify, binaries, github-release]
    if: vars.PUBLISH_CRATES == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # crates.io trusted publishing: GitHub's OIDC token is exchanged for a
      # short-lived crates.io token; no secret is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag names the version being published
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "confed") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Publishes all eight crates, each after those it depends on, each
      # verified by building it from its own package first.
      - run: cargo publish --locked --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
