name: Release

on:
  push:
    tags: ["v*"]
  # Build the binaries, and run the checks a release waits for, without
  # releasing or publishing anything: to try this workflow before a tag.
  workflow_dispatch:

# Jobs that need more say so.
permissions:
  contents: read

jobs:
  # All of CI — every system's tests, lints, MSRV, audit, licences — for the
  # tagged commit itself: nothing irrevocable happens unless it passes. The
  # same workflow, not a part of it repeated, so the two cannot disagree.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  verify:
    name: package check and tag
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Before the GitHub release is made, not only before the publish.
      - name: The tag names the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "confed") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version" >&2
            exit 1
          fi
      - run: cargo publish --locked --workspace --dry-run

  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for Linux and Windows: SQLite is bundled C, and a
          # cross build there would need a C toolchain for the target. On
          # macOS, Apple's clang builds for both architectures from one
          # runner, and Intel runners are being retired, so x86_64 is built
          # on Apple silicon.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # Static, for hosts whose glibc is older than the runner's (RHEL 8,
          # Debian 11, Amazon Linux 2): TLS is rustls and SQLite and zstd are
          # bundled, so musl leaves nothing dynamic.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          # `macos-latest` rather than a numbered image: a retired image is
          # refused before any step runs, which once cancelled every release.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl C compiler, for the bundled SQLite and zstd
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release -p confed --target ${{ matrix.target }}
      - name: The static binary runs on an old distribution
        if: contains(matrix.target, 'musl')
        run: |
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/bin-under-test:ro" \
            debian:11 /bin-under-test/confed version
      - name: Package
        shell: bash
        run: |
          name="confed-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/confed.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/confed" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  github-release:
    name: GitHub release
    needs: [verify, binaries]
    # One platform that failed to build must not cost the others their
    # release: it goes out with the archives there are, and its notes name
    # the ones missing. The checks of the tagged commit must still pass.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $version" >&2; exit 1; }
      - name: Name the platforms that did not build
        run: |
          missing=""
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                        x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            ls dist/*-"$target".* >/dev/null 2>&1 || missing="$missing $target"
          done
          test -n "$(ls dist 2>/dev/null)" || { echo "no binary was built" >&2; exit 1; }
          if [ -n "$missing" ]; then
            echo "::warning::not built:$missing"
            printf '\n> Not built for this release:%s\n' "$missing" >> notes.md
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: notes.md
          files: dist/*

  publish:
    name: publish to crates.io
    # Off until crates.io trusted publishing is configured for all eight crates
    # (it can only be set up once a crate exists, so the first release is
    # published by hand). Turn on with the repository variable
    # PUBLISH_CRATES=true — see "Releasing" in AGENTS.md.
    # Irrevocable, so last: only once the tagged commit passed its checks, every
    # binary built, and the GitHub release exists.
    needs: [verify, binaries, github-release]
    if: vars.PUBLISH_CRATES == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # crates.io trusted publishing: GitHub's OIDC token is exchanged for a
      # short-lived crates.io token; no secret is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: The tag names the version being published
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "confed") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Publishes all eight crates, each after those it depends on, each
      # verified by building it from its own package first.
      - run: cargo publish --locked --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
