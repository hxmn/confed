name: Fuzz

# The converter's fuzz targets, ten minutes each: weekly, and on demand from
# the Actions tab. A crash uploads the input that caused it.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [storage, markdown]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: crates/confed-converter
        run: |
          # The first directory takes what the fuzzer finds; the second seeds it.
          case "${{ matrix.target }}" in
            storage) seeds=fixtures ;;
            markdown) seeds=fuzz/seeds/markdown ;;
          esac
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cargo fuzz run ${{ matrix.target }} "fuzz/corpus/${{ matrix.target }}" "$seeds" \
            -- -max_total_time=600
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-${{ matrix.target }}
          path: crates/confed-converter/fuzz/artifacts
