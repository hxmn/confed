# Fuzz targets for the converter, run with cargo-fuzz on a nightly toolchain:
#   make fuzz                      # every target, a minute each
#   cargo +nightly fuzz run storage -- -max_total_time=600
# Not part of the workspace and never published.
[package]
name = "confed-converter-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# A workspace of its own, as cargo-fuzz lays it out.
[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
confed-converter = { path = ".." }

[[bin]]
name = "storage"
path = "fuzz_targets/storage.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false
